id: finance-analyze
category: finance
description: Claude orchestrates a multi-lens analysis of your finances over anonymized feature packs and writes an investing-oriented report.
runtime: claude
entry: prompt.md
triggers:
  - cli
  - schedule
  - skill
schedule: "0 9 1 * *"        # monthly, 1st at 09:00 LOCAL
tz: America/New_York
secrets:
  - CLAUDE_CODE_OAUTH_TOKEN   # subscription auth for headless claude
  - TELEGRAM_TOKEN
  - TELEGRAM_CHAT_ID
# Scoped to finance_cli only (features/store-insight/notify). finance_cli has
# NO raw-query subcommand, so raw financial data never enters Claude's context
# (§15.3). One pattern avoids multi-line-arg permission-split denials.
allowed_tools:
  - "Bash(python3 lib/py/finance_cli.py:*)"
deploy:
  target: local-cron         # finance is local-only (§11.5)
