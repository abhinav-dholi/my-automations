<text x="54" y="446" font-size="15" fill="#1e1e1e" text-anchor="start">SQLite  ·  data/finance.db   (gitignored · FileVault)</text>
<text x="54" y="472" font-size="12" fill="#343a40" text-anchor="start">core: accounts · transactions · balances · holdings        labels: transaction_labels (manual&gt;ai&gt;rule) · learned_categories · txn_flags</text>
<text x="54" y="486" font-size="12" fill="#343a40" text-anchor="start">market: prices · macro · news        splitwise: balances · expenses        outputs: snapshots · insights · chat_messages · balance_overrides</text>
<text x="40" y="554" font-size="16" fill="#f08c00" text-anchor="start" font-weight="600">④  DETERMINISTIC ANALYTICS</text>
<text x="1040" y="554" font-size="16" fill="#7048e8" text-anchor="start" font-weight="600">⑤  AI · Claude</text>
<rect x="40" y="564" width="472" height="212" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
<text x="54" y="590" font-size="15" fill="#1e1e1e" text-anchor="start">features.build()</text>
<text x="54" y="616" font-size="12" fill="#5c3c00" text-anchor="start">CASH WATERFALL (typical month):</text>
<text x="54" y="630" font-size="12" fill="#5c3c00" text-anchor="start">  take-home − spend + net reimbursements</text>
<text x="54" y="646" font-size="12" fill="#5c3c00" text-anchor="start">  = OPERATING CASH SURPLUS</text>
<text x="54" y="660" font-size="12" fill="#5c3c00" text-anchor="start">  (401k · one-time · savings-transfers: separate)</text>
<text x="54" y="676" font-size="12" fill="#5c3c00" text-anchor="start"></text>
<text x="54" y="690" font-size="12" fill="#5c3c00" text-anchor="start">NET WORTH = Σ effective acct value</text>
<text x="54" y="706" font-size="12" fill="#5c3c00" text-anchor="start">  − debts + Splitwise receivable</text>
<text x="54" y="720" font-size="12" fill="#5c3c00" text-anchor="start">allocation · concentration · emergency fund</text>
<rect x="532" y="564" width="480" height="212" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
<text x="546" y="590" font-size="15" fill="#1e1e1e" text-anchor="start">integrity → Data Health</text>
<text x="546" y="616" font-size="12" fill="#5c3c00" text-anchor="start">Reconciling invariants (every load):</text>
<text x="546" y="630" font-size="12" fill="#5c3c00" text-anchor="start">  • net worth == assets − debts (+ receivable)</text>
<text x="546" y="646" font-size="12" fill="#5c3c00" text-anchor="start">  • total assets ≥ net worth</text>
<text x="546" y="660" font-size="12" fill="#5c3c00" text-anchor="start">  • duplicate-detect: acct+merchant+amt ≤2d</text>
<text x="546" y="676" font-size="12" fill="#5c3c00" text-anchor="start">  • stale / phantom holdings · stale feeds</text>
<text x="546" y="690" font-size="12" fill="#5c3c00" text-anchor="start">  • balance ↔ transactions reconcile</text>
<text x="546" y="706" font-size="12" fill="#5c3c00" text-anchor="start"></text>
<text x="546" y="720" font-size="12" fill="#5c3c00" text-anchor="start">classification (transfers · finance_rules ·</text>
<text x="546" y="736" font-size="12" fill="#5c3c00" text-anchor="start">account_classify) feeds features.</text>
<rect x="1040" y="564" width="632" height="212" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1054" y="583" font-size="11" fill="#7048e8" text-anchor="start">🔒 privacy boundary — only aggregates (analyze/council) or</text>
<text x="1054" y="597" font-size="11" fill="#7048e8" text-anchor="start">txn descriptions (chat/categorize) cross; never account numbers.</text>
